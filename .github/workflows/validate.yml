name: Validate skills and optional adapters

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/validate.mjs
      - run: node scripts/trigger-test.mjs
      - run: node scripts/tripwire-check.mjs --self-test
      - run: node scripts/skill-eval.mjs
      - run: node scripts/rot-check.mjs --offline
      - run: node scripts/token-audit.mjs
      - run: node --test tests/*.test.mjs
