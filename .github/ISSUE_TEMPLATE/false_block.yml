name: "The Stop check or tripwire blocked something it shouldn't"
description: Report a reply or tool call that was blocked by mistake.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        The Stop check is a model's judgement, so it will sometimes be wrong; the exact text of each false block helps tune it. Remove secrets and private code before pasting anything.
  - type: dropdown
    id: check
    attributes:
      label: Which check blocked
      options:
        - "Stop check (Builder's Protocol check)"
        - "Tripwire (HALT-LOOP)"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: block-reason
    attributes:
      label: Block reason
      description: The reason text exactly as shown. For the Stop check, press ctrl+o after `Stop hook error occurred` to see it. For the tripwire, copy the `HALT-LOOP` line.
      render: text
    validations:
      required: true
  - type: textarea
    id: blocked
    attributes:
      label: What was blocked
      description: For the Stop check, the reply it sent back. For the tripwire, the tool calls in order up to the blocked one (tool name and arguments).
    validations:
      required: true
  - type: textarea
    id: why-wrong
    attributes:
      label: Why it should not have been blocked
      description: For example, the reply showed evidence for the claim, or the calls were not identical.
    validations:
      required: true
  - type: dropdown
    id: tripwire-env
    attributes:
      label: Was WISDOM_LENS_TRIPWIRE set?
      description: Check with `echo "$WISDOM_LENS_TRIPWIRE"` in the shell you started Claude Code from.
      options:
        - "Not set"
        - "Set to off, 0, false or no"
        - "Set to another value"
        - "Don't know"
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: The wisdom-lens version Claude Code shows, or the tag or commit you installed from.
      placeholder: "1.4.0"
    validations:
      required: true
